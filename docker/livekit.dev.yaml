# Self-hosted LiveKit server for local development.
#
# Keys are expanded from the container environment (`LIVEKIT_API_KEY` and
# `LIVEKIT_API_SECRET`), which docker compose injects from the project `.env`.
# The application and the worker read the same values, so the room join token
# and the agent registration stay in sync. These are development placeholders;
# never commit a real project key/secret here.
port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: false
  # Advertise localhost so a browser on the same machine reaches the UDP range
  # through the docker port mapping. For a remote browser (phone/LAN), set this
  # to the host's LAN IP instead.
  node_ip: 127.0.0.1

keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
