services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: wdk_agent
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - recipient_memory_postgres:/var/lib/postgresql/data
      - ./docker/init/001-recipient-app.sql:/docker-entrypoint-initdb.d/001-recipient-app.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wdk_agent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Self-hosted LiveKit signaling + media server. The config file expands
  # $LIVEKIT_API_KEY / $LIVEKIT_API_SECRET from the container environment,
  # which docker compose interpolates from the project `.env`.
  livekit:
    image: livekit/livekit-server:v1.9.3
    command: --config /etc/livekit/livekit.yaml
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50200:50000-50200/udp"
    volumes:
      - ./docker/livekit.dev.yaml:/etc/livekit/livekit.yaml:ro

volumes:
  recipient_memory_postgres:
