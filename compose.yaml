services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: wdk_agent
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - recipient_memory_postgres:/var/lib/postgresql/data
      - ./docker/init/001-recipient-app.sql:/docker-entrypoint-initdb.d/001-recipient-app.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wdk_agent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Self-hosted LiveKit signaling + media server. livekit-server reads its
  # whole config from the LIVEKIT_CONFIG env var; docker compose expands the
  # key/secret from the project .env (livekit's own $VAR expansion does not
  # apply to the keys section of the config file).
  livekit:
    image: livekit/livekit-server:v1.9.3
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50200
          use_external_ip: false
          node_ip: 127.0.0.1
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
    ports:
      - "7890:7880"
      - "7892:7881"
      - "50000-50200:50000-50200/udp"

volumes:
  recipient_memory_postgres:
