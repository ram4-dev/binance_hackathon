services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: wdk_agent
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - recipient_memory_postgres:/var/lib/postgresql/data
      - ./docker/init/001-recipient-app.sql:/docker-entrypoint-initdb.d/001-recipient-app.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wdk_agent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Self-hosted LiveKit signaling + media server, port layout adapted from the
  # aleph local-livekit-selfhost setup (v1.13.6 + LIVEKIT_KEYS env) so it
  # coexists with that stack on the same machine:
  #   - signaling published on 127.0.0.1:7890 -> container 7880
  #   - ICE-TCP 7892, RTC media UDP 7893-7903 (1:1 host:container)
  livekit:
    image: livekit/livekit-server:v1.13.6
    command: --config /etc/livekit.yaml
    environment:
      # livekit-server does not expand ${VAR} inside its config file (verified
      # against v1.13.6); the server reads keys from this env var instead.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7890:7880"
      - "7892:7892/tcp"
      - "7893-7903:7893-7903/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  recipient_memory_postgres:
